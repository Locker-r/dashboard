name: Staging team-management CORS origin configuration

# Manual only. This workflow reaches a hosted Supabase project's Edge
# Function secrets, so it starts when a person presses the button and names
# the target explicitly.
on:
  workflow_dispatch:
    inputs:
      project_ref:
        description: 'Type the staging project ref exactly to confirm the target: cjdxtakgmnzwixrajjry'
        required: true
        type: string
      allowed_origin:
        description: 'Type the exact allowed browser origin to confirm the target: https://locker-r.github.io'
        required: true
        type: string

permissions:
  contents: read

# Two runs racing each other is how a secret flips back and forth.
concurrency:
  group: staging-team-origin-config
  cancel-in-progress: false

jobs:
  configure:
    name: Dry run, apply, verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only main carries a reviewed, merged wrapper; a branch could have
    # anything in it.
    if: github.ref == 'refs/heads/main'
    # Carries the SUPABASE_ACCESS_TOKEN environment secret, and whatever
    # protection rules the staging environment has configured.
    environment: staging
    env:
      RELEASE_ENVIRONMENT: staging
      STAGING_PROJECT_REF: cjdxtakgmnzwixrajjry
      STAGING_ALLOWED_ORIGIN: https://locker-r.github.io
    steps:
      # Fail before the CLI is installed and before any secret is read: a
      # typo in either confirmation should cost nothing.
      - name: Confirm the target project ref and allowed origin
        shell: bash
        env:
          SUPPLIED_REF: ${{ inputs.project_ref }}
          SUPPLIED_ORIGIN: ${{ inputs.allowed_origin }}
        run: |
          if [[ "$SUPPLIED_REF" != "$STAGING_PROJECT_REF" ]]; then
            echo "Refused: project_ref must be exactly $STAGING_PROJECT_REF." >&2
            echo "Received: $SUPPLIED_REF" >&2
            exit 1
          fi
          if [[ "$SUPPLIED_ORIGIN" != "$STAGING_ALLOWED_ORIGIN" ]]; then
            echo "Refused: allowed_origin must be exactly $STAGING_ALLOWED_ORIGIN." >&2
            echo "Received: $SUPPLIED_ORIGIN" >&2
            exit 1
          fi
          echo "Target confirmed: $STAGING_ALLOWED_ORIGIN on $STAGING_PROJECT_REF"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # The wrapper is the only authorized path to this mutation; see
      # docs/release-gates.md, "The scoped exception: staging
      # team-management CORS origin". Nothing here calls `supabase secrets
      # set` directly, and the wrapper itself pins the project ref, secret
      # name, and value — nothing here passes those as arguments.
      - name: Dry run
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/release/staging-team-origin-config.cjs --dry-run

      # Reached only when the dry run exited 0: a failed step fails the job.
      - name: Apply
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/release/staging-team-origin-config.cjs --apply

      # Proves the applied state is the intended state rather than trusting
      # the apply step's own exit code.
      - name: Verify the secret is now present
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/release/staging-team-origin-config.cjs --dry-run

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Staging team-management CORS origin configuration"
            echo ""
            echo "- Project ref: \`$STAGING_PROJECT_REF\`"
            echo "- Allowed origin: \`$STAGING_ALLOWED_ORIGIN\`"
            echo "- Environment: \`staging\`"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Result: \`${{ job.status }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
