name: Release

# A tag marks a reviewed, gated snapshot of main. It deploys nothing:
# no production deployment pipeline exists yet. See docs/release-governance.md.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    name: Verify tag and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Narrowed to this job: the only write privilege in the repository.
      # Third-party actions are pinned by commit SHA because of it.
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Verify the tag is an ancestor of main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag $GITHUB_REF_NAME does not point at a commit contained in origin/main." >&2
            exit 1
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run check:js
      - run: npm run check:secrets
      - run: npm run check:migrations

      - name: Extract the changelog entry for this version
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v version="$version" '
            $0 ~ "^## \\[" version "\\]" { inside = 1; next }
            inside && /^## / { exit }
            inside { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "CHANGELOG.md has no '## [$version]' section." >&2
            exit 1
          fi

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md --verify-tag
