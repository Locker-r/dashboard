name: Staging Pages deployment

# Manual only. Publishing changes what a public URL serves, so it starts
# when a person presses the button and names the target explicitly.
on:
  workflow_dispatch:
    inputs:
      project_ref:
        description: 'Type the staging project ref exactly to confirm the target: cjdxtakgmnzwixrajjry'
        required: true
        type: string

permissions:
  contents: read

# Two publishes racing each other is how a deployed site ends up half one
# build and half another.
concurrency:
  group: staging-pages-deploy
  cancel-in-progress: false

jobs:
  build:
    name: Build the Pages artifact
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only main carries reviewed source; a branch could have anything in it.
    if: github.ref == 'refs/heads/main'
    environment: staging
    env:
      STAGING_PROJECT_REF: cjdxtakgmnzwixrajjry
      # GitHub Pages URL and Supabase project ref are both stable, public
      # identifiers for this one pinned staging target — not secrets, and not
      # worth a manual variable when they're fully determined by the ref above.
      STAGING_PAGES_URL: https://locker-r.github.io/dashboard/
      DASHBOARD_SUPABASE_PROJECT_URL: https://cjdxtakgmnzwixrajjry.supabase.co
      # The anon/publishable key is public-safe to embed in a frontend
      # artifact but is not derivable from the project ref, so it comes from
      # a repository/environment *variable* (not a secret) that a human sets
      # once from the Supabase dashboard. See docs/release-gates.md.
      DASHBOARD_SUPABASE_PUBLISHABLE_KEY: ${{ vars.STAGING_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      # Fail before anything is built: a typo in the confirmation should cost
      # nothing.
      - name: Confirm the target project ref
        shell: bash
        env:
          SUPPLIED_REF: ${{ inputs.project_ref }}
        run: |
          if [[ "$SUPPLIED_REF" != "$STAGING_PROJECT_REF" ]]; then
            echo "Refused: project_ref must be exactly $STAGING_PROJECT_REF." >&2
            echo "Received: $SUPPLIED_REF" >&2
            exit 1
          fi
          echo "Target confirmed: $STAGING_PROJECT_REF"

      - name: Confirm the publishable key variable is set
        shell: bash
        run: |
          if [[ -z "$DASHBOARD_SUPABASE_PUBLISHABLE_KEY" ]]; then
            echo "Refused: the vars.STAGING_SUPABASE_PUBLISHABLE_KEY environment variable is not set." >&2
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # scripts/build-pages-artifact.cjs never accepts a service-role key, a
      # DB password, or an access token as input — only DASHBOARD_SUPABASE_PROJECT_URL
      # and DASHBOARD_SUPABASE_PUBLISHABLE_KEY, both public-safe frontend
      # values. See scripts/build-pages-artifact.cjs CONFIG_ENV.
      - name: Build the Pages artifact
        run: npm run build:pages

      - name: Validate the built artifact
        run: node scripts/build-pages-artifact.cjs --validate-only

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/pages-site

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.ref == 'refs/heads/main'
    environment:
      name: staging
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      # Proves the URL actually deployed to is the one this policy pins,
      # rather than trusting the action's own success alone.
      - name: Verify the deployed URL matches the pinned staging URL exactly
        shell: bash
        env:
          DEPLOYED_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          if [[ "$DEPLOYED_URL" != "https://locker-r.github.io/dashboard/" ]]; then
            echo "Refused: deployed URL does not match the pinned staging URL." >&2
            echo "Expected: https://locker-r.github.io/dashboard/" >&2
            echo "Received: $DEPLOYED_URL" >&2
            exit 1
          fi
          echo "Deployed URL confirmed: $DEPLOYED_URL"

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Staging Pages deployment"
            echo ""
            echo "- URL: \`${{ steps.deployment.outputs.page_url }}\`"
            echo "- Environment: \`staging\`"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Result: \`${{ job.status }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
