name: Quality gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Tests, syntax, diff, and secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Pull-request checkouts are detached and carry no main ref, which would
      # force project-status validation onto the merge-parent fallback. Fetching
      # the ref explicitly keeps validation on verified refs on every event.
      - name: Fetch origin/main for project-status validation
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check:js
      - run: npm run check:secrets
      - run: npm run check:migrations
      - name: Audit production dependencies
        # Development tooling must not gate a release; runtime dependencies must.
        run: npm audit --omit=dev --audit-level=high
      - name: Check changed-line whitespace
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then BASE_SHA="HEAD^"; fi
          git diff --check "$BASE_SHA" "$GITHUB_SHA"

  dependency-review:
    name: Dependency review
    # Pull requests only: the action compares a head against a base ref.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  windows-powershell:
    name: SQL and server PowerShell checks
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Check atomic write SQL
        shell: powershell
        run: .\scripts\check-atomic-writes.ps1
      - name: Check runtime smoke harness structure
        shell: powershell
        run: .\scripts\check-runtime-smoke-harness.ps1
      - name: Check team management server foundation
        shell: powershell
        run: .\scripts\check-team-management.ps1
